name: Build Release APK & AAB - Kitab Hadits Pro

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publikasikan ke GitHub Release otomatis'
        required: false
        type: boolean
        default: true

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign Release Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2. Set up JDK 21 (Temurin)"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "3. Siapkan File Environment (.env)"
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: "4. Beri Izin Eksekusi Gradle Wrapper"
        run: chmod +x gradlew

      - name: "5. Siapkan Keystore Tanda Tangan Rilis Permanen"
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          # Prioritas 1: Gunakan Secret jika diatur di GitHub Secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan Release Keystore dari GitHub Secrets..."
            KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
            STORE_PASS="${STORE_PASS_SECRET:-android}"
            KEY_PASS="${KEY_PASS_SECRET:-android}"
            KEY_ALIAS="${KEY_ALIAS_SECRET:-androiddebugkey}"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          # Prioritas 2: Gunakan berkas my-upload-key.jks jika ada
          elif [ -f "my-upload-key.jks" ]; then
            echo "Menggunakan berkas my-upload-key.jks..."
            KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
            STORE_PASS="${STORE_PASS_SECRET:-kompaskiblat2026}"
            KEY_PASS="${KEY_PASS_SECRET:-kompaskiblat2026}"
            KEY_ALIAS="${KEY_ALIAS_SECRET:-upload}"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          # Prioritas 3: Gunakan debug.keystore.base64 bawaan proyek (Sidik Jari Permanen Abadi)
          elif [ -f "debug.keystore.base64" ]; then
            echo "Memulihkan debug.keystore resmi dari debug.keystore.base64 (Sidik Jari Permanen)..."
            base64 -d debug.keystore.base64 > "${{ github.workspace }}/debug.keystore"
            KEYSTORE_FILE="${{ github.workspace }}/debug.keystore"
            STORE_PASS="android"
            KEY_PASS="android"
            KEY_ALIAS="androiddebugkey"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          else
            echo "Menggunakan debug.keystore yang sudah ada di repositori..."
            KEYSTORE_FILE="${{ github.workspace }}/debug.keystore"
            STORE_PASS="android"
            KEY_PASS="android"
            KEY_ALIAS="androiddebugkey"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          fi

          echo "Informasi Sidik Jari Keystore yang Digunakan:"
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | grep -E "SHA1:|SHA256:" || true

      - name: "6. Build Release AAB & APK (Optimized Memory & Stacktrace)"
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"
        run: |
          echo "=== 6.1 Membangun AAB (Android App Bundle untuk Google Play) ==="
          ./gradlew bundleRelease --stacktrace --no-daemon
          echo "=== 6.2 Membangun APK Rilis Langsung (Untuk Pengujian & Instalasi) ==="
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: "7. Siapkan Folder Artefak Rilis"
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-artifacts/KitabHaditsPro-Release.apk \; 2>/dev/null || true
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} release-artifacts/KitabHaditsPro-Release.aab \; 2>/dev/null || true
          TARGET_KEY="${KEYSTORE_PATH:-${KEYSTORE_FILE_PATH:-${{ github.workspace }}/debug.keystore}}"
          if [ -f "$TARGET_KEY" ]; then
            cp "$TARGET_KEY" release-artifacts/permanent-release.keystore
          fi
          if [ -f "upload_certificate.pem" ]; then
            cp upload_certificate.pem release-artifacts/upload_certificate.pem
          fi
          echo "=== Berkas Artefak yang Siap Diunggah ==="
          ls -lh release-artifacts/

      - name: "8. Upload Artifact: Paket Rilis Lengkap (APK + AAB + Keystore)"
        uses: actions/upload-artifact@v4
        with:
          name: Kitab-Hadits-Pro-Release-Package
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 60

      - name: "9. Upload Artifact: AAB Google Play Store"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 60

      - name: "10. Upload Artifact: APK Standalone Installable"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: "11. Publikasikan ke GitHub Release"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0-build{0}', github.run_number) }}
          name: "Release v1.0 (Build ${{ github.run_number }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
