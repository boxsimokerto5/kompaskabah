name: Build Release APK & AAB (Google Play Ready)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Buat GitHub Release otomatis jika di-trigger manual?'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign Release Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Siapkan File Environment (.env)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: 5. Beri Izin Eksekusi Gradle Wrapper
        run: chmod +x gradlew

      - name: 6. Buat / Siapkan Release Signature Keystore Otomatis
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD || 'kompaskiblat2026' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'kompaskiblat2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan Release Keystore yang didefinisikan dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          elif [ -f "my-upload-key.jks" ]; then
            echo "Menggunakan file my-upload-key.jks yang sudah ada..."
          else
            echo "Membuat Keystore Tanda Tangan Rilis Otomatis dengan keytool..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Kompas Kiblat, OU=Android, O=Kompas Kiblat, L=Jakarta, ST=DKI Jakarta, C=ID"
          fi

          # Tampilkan info fingerprint SHA-1 & SHA-256 untuk Google Play Console
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | grep -E "SHA1:|SHA256:" || true

      - name: 7. Build Release AAB (Android App Bundle untuk Google Play Console)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: 8. Build Release APK (Standalone Installable APK)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: 9. Verifikasi Keberadaan Output File
        run: |
          echo "=== File AAB Release ==="
          ls -lh app/build/outputs/bundle/release/
          echo "=== File APK Release ==="
          ls -lh app/build/outputs/apk/release/

      - name: 10. Upload Artifact: AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 60

      - name: 11. Upload Artifact: APK (Universal Installable)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: 12. Upload Backup Keystore (Penting untuk Update Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-backup
          path: ${{ env.KEYSTORE_PATH }}
          retention-days: 60

      - name: 13. Publikasikan ke GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Release ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
