name: Build Release APK & AAB (Google Play Ready)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publikasikan ke GitHub Release otomatis'
        required: false
        type: boolean
        default: true

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign Release Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2. Set up JDK 21 (Temurin)"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "3. Siapkan File Environment (.env)"
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: "4. Beri Izin Eksekusi Gradle Wrapper"
        run: chmod +x gradlew

      - name: "5. Siapkan Keystore Tanda Tangan Rilis"
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          STORE_PASS="${STORE_PASS_SECRET:-kompaskiblat2026}"
          KEY_PASS="${KEY_PASS_SECRET:-kompaskiblat2026}"
          KEY_ALIAS="${KEY_ALIAS_SECRET:-upload}"

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan Release Keystore dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          elif [ -f "my-upload-key.jks" ]; then
            echo "Menggunakan file my-upload-key.jks yang sudah ada..."
          else
            echo "Membuat Keystore Tanda Tangan Rilis Otomatis dengan keytool..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Kompas Kiblat, OU=Android, O=Kompas Kiblat, L=Jakarta, ST=DKI Jakarta, C=ID"
          fi

          echo "Informasi Sidik Jari Keystore:"
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | grep -E "SHA1:|SHA256:" || true

      - name: "6. Build Release APK & AAB (Bundle & Installable APK)"
        run: ./gradlew assembleRelease bundleRelease -x lint -x lintVitalRelease --stacktrace

      - name: "7. Siapkan Folder Artefak Rilis"
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/KompasKiblat-Release.apk 2>/dev/null || cp app/build/outputs/apk/release/*.apk release-artifacts/
          cp app/build/outputs/bundle/release/*.aab release-artifacts/KompasKiblat-Release.aab 2>/dev/null || cp app/build/outputs/bundle/release/*.aab release-artifacts/
          if [ -f "$KEYSTORE_PATH" ]; then
            cp "$KEYSTORE_PATH" release-artifacts/my-upload-key.jks
          fi
          echo "=== Berkas Artefak yang Siap Diunggah ==="
          ls -lh release-artifacts/

      - name: "8. Upload Artifact: Paket Rilis Lengkap (APK + AAB + Keystore)"
        uses: actions/upload-artifact@v4
        with:
          name: Kompas-Kiblat-Release-Package
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 60

      - name: "9. Upload Artifact: AAB Google Play Store"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 60

      - name: "10. Upload Artifact: APK Standalone Installable"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: "11. Publikasikan ke GitHub Release"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0-build{0}', github.run_number) }}
          name: "Release v1.0 (Build ${{ github.run_number }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
